name: Telegram Gonder

on:
  # Zamanlanmış çalıştırma
  # NOT: GitHub cron bazen 5-30 dk gecikebilir. Bu normaldir.
  # Türkiye saati UTC+3:
  #   12:00 TR = 09:00 UTC
  #   15:00 TR = 12:00 UTC
  #   17:00 TR = 14:00 UTC
  #   20:00 TR = 17:00 UTC
  #   00:00 TR = 21:00 UTC
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 21 * * *'

  # Manuel tetikleme (Actions sekmesinden "Run workflow" butonu)
  workflow_dispatch:

# Aynı anda birden fazla çalışmasın
concurrency:
  group: telegram-gonder
  cancel-in-progress: false

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: 1) Repoyu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 2) Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3) Kütüphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests python-dotenv

      - name: 4) Görsel üret ve Telegram'a gönder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gonder.py

      - name: 5) Değişiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Gonderim: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
